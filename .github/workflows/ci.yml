name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.engine }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        engine: [sqlite, mysql, pgsql]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: gravdbkit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gravdbkit_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GRAVDBKIT_TEST_ENGINE: ${{ matrix.engine }}
      GRAVDBKIT_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=gravdbkit_test;charset=utf8mb4'
      GRAVDBKIT_TEST_MYSQL_USER: root
      GRAVDBKIT_TEST_MYSQL_PASS: ''
      GRAVDBKIT_TEST_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=gravdbkit_test'
      GRAVDBKIT_TEST_PGSQL_USER: postgres
      GRAVDBKIT_TEST_PGSQL_PASS: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_sqlite, pdo_mysql, pdo_pgsql
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # AdoptionTest needs real Forum Pro and KahunaCart databases, which only
      # exist on a developer machine; it skips here and says so.
      - name: Run tests (${{ matrix.engine }})
        run: vendor/bin/phpunit --display-skipped
